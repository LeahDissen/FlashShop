<!DOCTYPE html>
<html lang="en" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>חנות מתנות אישית</title>
  <style>
    /* Hide number input arrows */
    input[type='number'] {
      -moz-appearance: textfield;
    }

    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    /* Tooltip styles */
    [data-tooltip] {
      position: relative;
    }

    [data-tooltip]::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%) translateY(-8px);
      background-color: #111827;
      /* gray-900 */
      color: white;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      line-height: 1.4;
      white-space: nowrap;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.1s ease-in-out, visibility 0.1s ease-in-out, transform 0.1s ease-in-out;
      pointer-events: none;
      z-index: 100000;
      /* Extremely high z-index */
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Tooltip Arrow */
    [data-tooltip]::before {
      content: '';
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%) translateY(-4px);
      border-width: 6px;
      border-style: solid;
      border-color: #111827 transparent transparent transparent;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.1s ease-in-out, visibility 0.1s ease-in-out, transform 0.1s ease-in-out;
      pointer-events: none;
      z-index: 100000;
    }

    /* Hover state */
    [data-tooltip]:hover::after {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(-10px);
    }

    [data-tooltip]:hover::before {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(-4px);
    }

    /* Bottom Position Variant */
    [data-tooltip-pos="bottom"]::after {
      bottom: auto;
      top: 100%;
      transform: translateX(-50%) translateY(8px);
    }

    [data-tooltip-pos="bottom"]::before {
      bottom: auto;
      top: 100%;
      transform: translateX(-50%) translateY(-4px) rotate(180deg);
    }

    [data-tooltip-pos="bottom"]:hover::after {
      transform: translateX(-50%) translateY(12px);
    }

    [data-tooltip-pos="bottom"]:hover::before {
      transform: translateX(-50%) translateY(0px) rotate(180deg);
    }

    /* ReactCrop CSS Inlined */
    .ReactCrop {
      position: relative;
      display: inline-block;
      cursor: crosshair;
      overflow: hidden;
      max-width: 100%;
    }

    .ReactCrop *,
    .ReactCrop *:before,
    .ReactCrop *:after {
      box-sizing: border-box;
    }

    .ReactCrop--disabled,
    .ReactCrop--locked {
      cursor: inherit;
    }

    .ReactCrop__child-wrapper {
      max-height: 100%;
      max-width: 100%;
    }

    .ReactCrop__image {
      display: block;
      max-width: 100%;
      max-height: 100%;
    }

    .ReactCrop__crop-selection {
      position: absolute;
      top: 0;
      left: 0;
      transform: translate3d(0, 0, 0);
      box-sizing: border-box;
      cursor: move;
      box-shadow: 0 0 0 9999em rgba(0, 0, 0, 0.5);
      touch-action: none;
    }

    .ReactCrop--disabled .ReactCrop__crop-selection {
      cursor: inherit;
    }

    .ReactCrop--circular-crop .ReactCrop__crop-selection {
      border-radius: 50%;
    }

    .ReactCrop__rule-of-thirds-vt:before,
    .ReactCrop__rule-of-thirds-vt:after,
    .ReactCrop__rule-of-thirds-hz:before,
    .ReactCrop__rule-of-thirds-hz:after {
      content: '';
      display: block;
      position: absolute;
      background-color: rgba(255, 255, 255, 0.4);
    }

    .ReactCrop__rule-of-thirds-vt:before,
    .ReactCrop__rule-of-thirds-vt:after {
      width: 1px;
      height: 100%;
    }

    .ReactCrop__rule-of-thirds-vt:before {
      left: 33.3333%;
    }

    .ReactCrop__rule-of-thirds-vt:after {
      left: 66.6666%;
    }

    .ReactCrop__rule-of-thirds-hz:before,
    .ReactCrop__rule-of-thirds-hz:after {
      width: 100%;
      height: 1px;
    }

    .ReactCrop__rule-of-thirds-hz:before {
      top: 33.3333%;
    }

    .ReactCrop__rule-of-thirds-hz:after {
      top: 66.6666%;
    }

    .ReactCrop__drag-handle {
      position: absolute;
      width: 10px;
      height: 10px;
      background-color: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.7);
      box-sizing: border-box;
    }

    .ReactCrop__drag-handle::after {
      position: absolute;
      content: '';
      display: block;
      width: 100%;
      height: 100%;
      background-color: transparent;
    }

    .ReactCrop .ord-nw {
      top: 0;
      left: 0;
      margin-top: -5px;
      margin-left: -5px;
      cursor: nw-resize;
    }

    .ReactCrop .ord-n {
      top: 0;
      left: 50%;
      margin-top: -5px;
      margin-left: -5px;
      cursor: n-resize;
    }

    .ReactCrop .ord-ne {
      top: 0;
      right: 0;
      margin-top: -5px;
      margin-right: -5px;
      cursor: ne-resize;
    }

    .ReactCrop .ord-e {
      top: 50%;
      right: 0;
      margin-top: -5px;
      margin-right: -5px;
      cursor: e-resize;
    }

    .ReactCrop .ord-se {
      bottom: 0;
      right: 0;
      margin-bottom: -5px;
      margin-right: -5px;
      cursor: se-resize;
    }

    .ReactCrop .ord-s {
      bottom: 0;
      left: 50%;
      margin-bottom: -5px;
      margin-left: -5px;
      cursor: s-resize;
    }

    .ReactCrop .ord-sw {
      bottom: 0;
      left: 0;
      margin-bottom: -5px;
      margin-left: -5px;
      cursor: sw-resize;
    }

    .ReactCrop .ord-w {
      top: 50%;
      left: 0;
      margin-top: -5px;
      margin-left: -5px;
      cursor: w-resize;
    }

    /* עורך חיתוך — פיתוח תמונות: בלי רקע שחור, תצוגה ממורכזת */
    .photo-print-crop.ReactCrop {
      display: block;
      margin: 0 auto;
      background: #f9fafb;
      line-height: 0;
    }

    .photo-print-crop .ReactCrop__crop-selection {
      box-shadow: 0 0 0 9999em rgba(255, 255, 255, 0.55);
      border: 2px solid #f2665e;
    }

    .photo-print-crop .ReactCrop__drag-handle {
      background-color: #fff;
      border: 2px solid #f2665e;
      width: 12px;
      height: 12px;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
